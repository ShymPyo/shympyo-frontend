<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8"/>
	<title>Kakao Maps</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            width: 100%;
            height: calc(100% - 70px);
        }
        .category-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 15px 20px;
            background-color: #FFFFFF;
            border-bottom: 1px solid #E5E5E5;
            height: 70px;
            box-sizing: border-box;
        }
        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .category-pin {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 4px;
            position: relative;
        }
        .category-pin::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid currentColor;
        }
        .category-pin.shelter {
            background-color: #7B7BF7;
        }
        .category-pin.shelter::after {
            border-top-color: #7B7BF7;
        }
        .category-pin.private {
            background-color: #A5A5E8;
        }
        .category-pin.private::after {
            border-top-color: #A5A5E8;
        }
        .category-pin.transport {
            background-color: #4A90E2;
        }
        .category-pin.transport::after {
            border-top-color: #4A90E2;
        }
        .category-pin.public {
            background-color: #8A8A8A;
        }
        .category-pin.public::after {
            border-top-color: #8A8A8A;
        }
        .category-text {
            font-size: 12px;
            color: #666666;
            font-weight: 500;
        }
        .pin-icon {
            color: white;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- 핀 카테고리 -->
    <div class="category-container">
        <div class="category-item">
            <div class="category-pin shelter">
                <span class="pin-icon">+</span>
            </div>
            <span class="category-text">쉘터</span>
        </div>
        <div class="category-item">
            <div class="category-pin private">
                <span class="pin-icon">🏢</span>
            </div>
            <span class="category-text">민간</span>
        </div>
        <div class="category-item">
            <div class="category-pin transport">
                <span class="pin-icon">🚗</span>
            </div>
            <span class="category-text">교통</span>
        </div>
        <div class="category-item">
            <div class="category-pin public">
                <span class="pin-icon">🏛️</span>
            </div>
            <span class="category-text">공공</span>
        </div>
    </div>
    <div id="map"></div>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=76e23ff1c2370fd1c14d17f2370c8985"></script>
    <script>
        // 브라우저의 Geolocation API 차단
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition = function() {
                console.log('Geolocation blocked');
            };
            navigator.geolocation.watchPosition = function() {
                console.log('Geolocation watch blocked');
            };
        }

        window.addEventListener('load', function() {
            try {
                var container = document.getElementById('map');
                if (!container) {
                    console.error('Map container not found');
                    return;
                }

                var options = {
                    center: new kakao.maps.LatLng(37.5665, 126.978),
                    level: 4
                };

                var map = new kakao.maps.Map(container, options);
                console.log('Map initialized successfully');

        var positions = [
            {
                title: '카페 빈스',
                latlng: new kakao.maps.LatLng(37.4485, 126.6584)
            },
            {
                title: '용현노인문화센터',
                latlng: new kakao.maps.LatLng(37.4505, 126.6564)
            },
            {
                title: '인하대역',
                latlng: new kakao.maps.LatLng(37.4495, 126.6554)
            },
            {
                title: '스마트쉼터',
                latlng: new kakao.maps.LatLng(37.4515, 126.6594)
            },
            {
                title: '공공시설',
                latlng: new kakao.maps.LatLng(37.4475, 126.6534)
            }
        ];

                for (var i = 0; i < positions.length; i ++) {
                    var marker = new kakao.maps.Marker({
                        map: map,
                        position: positions[i].latlng,
                        title: positions[i].title
                    });
                }

                // 현위치 마커 관련 변수
                var currentPositionMarker = null;
                var currentHeading = 0;

                // 현위치 마커 이미지 생성 (방향 표시 포함)
                function createCurrentLocationMarker(heading) {
                    var svg = `
                        <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                                    <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
                                    <feOffset dx="0" dy="1" result="offsetblur"/>
                                    <feComponentTransfer>
                                        <feFuncA type="linear" slope="0.3"/>
                                    </feComponentTransfer>
                                    <feMerge>
                                        <feMergeNode/>
                                        <feMergeNode in="SourceGraphic"/>
                                    </feMerge>
                                </filter>
                            </defs>
                            <g transform="translate(20, 20) rotate(${heading})">
                                <!-- 외곽 원 -->
                                <circle cx="0" cy="0" r="12" fill="#4285F4" opacity="0.3" filter="url(#shadow)"/>
                                <!-- 내부 원 -->
                                <circle cx="0" cy="0" r="8" fill="#4285F4" stroke="white" stroke-width="2"/>
                                <!-- 방향 표시 화살표 -->
                                <path d="M 0,-8 L 4,-2 L 0,0 L -4,-2 Z" fill="white"/>
                            </g>
                        </svg>
                    `;

                    var svgBlob = new Blob([svg], {type: 'image/svg+xml'});
                    return URL.createObjectURL(svgBlob);
                }

                // 현위치 마커 업데이트
                function updateCurrentLocation(position) {
                    console.log('updateCurrentLocation called with:', position);
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    var heading = position.coords.heading || currentHeading;

                    console.log('lat:', lat, 'lng:', lng, 'heading:', heading);

                    // heading이 null이 아니면 업데이트
                    if (heading !== null && heading !== undefined) {
                        currentHeading = heading;
                    }

                    var locPosition = new kakao.maps.LatLng(lat, lng);

                    if (currentPositionMarker) {
                        console.log('Updating existing marker');
                        // 기존 마커 위치와 이미지 업데이트
                        currentPositionMarker.setPosition(locPosition);

                        var markerImageUrl = createCurrentLocationMarker(currentHeading);
                        var markerImageSize = new kakao.maps.Size(40, 40);
                        var markerImageOption = {offset: new kakao.maps.Point(20, 20)};
                        var markerImage = new kakao.maps.MarkerImage(markerImageUrl, markerImageSize, markerImageOption);
                        currentPositionMarker.setImage(markerImage);
                    } else {
                        console.log('Creating new marker');
                        // 새 마커 생성
                        var markerImageUrl = createCurrentLocationMarker(currentHeading);
                        console.log('Marker image URL:', markerImageUrl);
                        var markerImageSize = new kakao.maps.Size(40, 40);
                        var markerImageOption = {offset: new kakao.maps.Point(20, 20)};
                        var markerImage = new kakao.maps.MarkerImage(markerImageUrl, markerImageSize, markerImageOption);

                        currentPositionMarker = new kakao.maps.Marker({
                            map: map,
                            position: locPosition,
                            image: markerImage,
                            zIndex: 1000
                        });

                        console.log('Marker created, centering map');
                        // 첫 위치로 지도 중심 이동
                        map.setCenter(locPosition);
                    }
                }

                // 위치 오류 처리
                function handleLocationError(error) {
                    console.error('위치 정보 오류:', error);
                }

                // 고정 위치 설정 (서울 시청)
                var fixedPosition = {
                    coords: {
                        latitude: 37.5665,
                        longitude: 126.978,
                        heading: 0
                    }
                };

                // 고정 위치로 현위치 마커 생성
                updateCurrentLocation(fixedPosition);

                // React Native에서 위치 데이터 받기 (무시)
                window.addEventListener('message', function(event) {
                    console.log('Message ignored:', event.data);
                });

                // Android용 메시지 리스너 (무시)
                document.addEventListener('message', function(event) {
                    console.log('Message ignored:', event.data);
                });

            } catch (error) {
                console.error('Error initializing map:', error);
                var container = document.getElementById('map');
                if (container) {
                    container.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100%;color:red;">맵을 불러오는데 실패했습니다.</div>';
                }
            }
        });

    </script>
</body>
</html>
