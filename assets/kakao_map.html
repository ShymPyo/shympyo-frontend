<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Kakao Maps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #map .label, #map .info { display: none !important; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- ✅ autoload=false 로 수정 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=76e23ff1c2370fd1c14d17f2370c8985&autoload=false"></script>
  <script>
    kakao.maps.load(function() {
      try {
        // --- 초기화 ---
        function getQueryParam(name) {
          const urlParams = new URLSearchParams(window.location.search);
          return urlParams.get(name);
        }
        const urlLat = parseFloat(getQueryParam('lat'));
        const urlLng = parseFloat(getQueryParam('lng'));
        const initialLat = isNaN(urlLat) ? 37.5665 : urlLat;
        const initialLng = isNaN(urlLng) ? 126.9780 : urlLng;

        const map = new kakao.maps.Map(document.getElementById('map'), {
          center: new kakao.maps.LatLng(initialLat, initialLng),
          level: 3
        });
        map.relayout();

        // --- 전역 변수 ---
        window.map = map;
        window.markers = [];
        window.currentPositionMarker = null;
        window.animState = {
          currentLat: initialLat,
          currentLng: initialLng,
          currentHeading: 0,
          targetLat: initialLat,
          targetLng: initialLng,
          targetHeading: 0,
          isAnimating: false
        };

        // --- 헬퍼 함수 (쉼터 핀용) ---
        window.createMarkerImageWithShadow = function(pinImageSrc, width, height) {
          const svg = `<svg width="${width+8}" height="${height+6}" viewBox="0 0 ${width+8} ${height+6}" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="${(width+8)/2}" cy="${height+3}" rx="${width*0.25}" ry="2" fill="black" opacity="0.2"/>
            <image href="${pinImageSrc}" x="4" y="0" width="${width}" height="${height}"/>
          </svg>`;
          return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        };

        window.createHighlightMarkerImage = function(pinImageSrc, width, height) {
          const svg = `<svg width="${width+24}" height="${height+6}" viewBox="0 0 ${width+24} ${height+6}" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="${(width+24)/2}" cy="${height+3}" rx="${width*0.35}" ry="4" fill="black" opacity="0.4"/>
            <image href="${pinImageSrc}" x="12" y="0" width="${width}" height="${height}"/>
          </svg>`;
          return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        };

        // --- 내 위치 마커 ---
        function createMyLocationSvg(heading) {
          const rotation = heading || 0;
          const svg = `
            <svg width="52" height="52" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <filter id="markerShadow" x="-50%" y="-50%" width="200%" height="200%">
                  <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="rgba(0,0,0,0.5)" />
                </filter>
              </defs>
              <g filter="url(#markerShadow)">
                <circle cx="26" cy="26" r="11" fill="#FF2B2B" stroke="white" stroke-width="3"/>
                <g transform="rotate(${rotation} 26 26) translate(0, -6)">
                  <path d="M26 8 L30.5 17 L26 14.5 L21.5 17 Z" fill="white"/>
                </g>
              </g>
            </svg>`;
          return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        }

        // --- 애니메이션 루프 ---
        function animationLoop() {
          if (!window.animState.isAnimating) return;
          const easing = 0.2;
          const s = window.animState;
          s.currentLat += (s.targetLat - s.currentLat) * easing;
          s.currentLng += (s.targetLng - s.currentLng) * easing;
          let diff = s.targetHeading - s.currentHeading;
          while (diff < -180) diff += 360;
          while (diff > 180) diff -= 360;
          s.currentHeading += diff * easing;

          const pos = new kakao.maps.LatLng(s.currentLat, s.currentLng);
          const markerImage = new kakao.maps.MarkerImage(
            createMyLocationSvg(s.currentHeading),
            new kakao.maps.Size(52, 52),
            { offset: new kakao.maps.Point(26, 26) }
          );

          if (window.currentPositionMarker) {
            window.currentPositionMarker.setPosition(pos);
            window.currentPositionMarker.setImage(markerImage);
          } else {
            window.currentPositionMarker = new kakao.maps.Marker({
              map: window.map,
              position: pos,
              image: markerImage,
              zIndex: 1000
            });
          }

          const dist = Math.abs(s.targetLat - s.currentLat) + Math.abs(s.targetLng - s.currentLng);
          if (dist < 0.000001 && Math.abs(diff) < 0.1) s.isAnimating = false;
          else requestAnimationFrame(animationLoop);
        }

        // --- RN에서 위치 포커스 ---
        window.focusOnLocation = function(lat, lng, heading) {
          if (!window.map || !window.animState) return;
          const s = window.animState;
          s.targetLat = lat;
          s.targetLng = lng;
          if (heading !== undefined && heading !== null) s.targetHeading = heading;

          const moveLatLng = new kakao.maps.LatLng(lat, lng);
          window.map.setLevel(2, { anchor: moveLatLng });
          window.map.panTo(moveLatLng);

          if (!s.isAnimating) {
            s.isAnimating = true;
            requestAnimationFrame(animationLoop);
          }
        };

        // --- 쉼터 마커 추가 ---
        window.addShelters = function(list) {
          if (!window.map) return;
          window.markers.forEach(m => m.marker.setMap(null));
          window.markers = [];
          list.forEach(shelter => {
            const pos = new kakao.maps.LatLng(shelter.lat, shelter.lng);
            const pin = shelter.iconUrl || "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png";
            const img = window.createMarkerImageWithShadow(pin, 36, 46);
            const markerImage = new kakao.maps.MarkerImage(img, new kakao.maps.Size(44, 52), { offset: new kakao.maps.Point(22, 49) });
            const marker = new kakao.maps.Marker({ map: window.map, position: pos, image: markerImage });
            window.markers.push({ id: shelter.id, marker, pinImage: pin });
          });
        };

        // --- 쉼터 강조 ---
        window.highlightShelter = function(id, lat, lng) {
          if (!window.map) return;
          window.markers.forEach(m => {
            if (m.marker && m.pinImage) {
              const img = window.createMarkerImageWithShadow(m.pinImage, 36, 46);
              const normal = new kakao.maps.MarkerImage(img, new kakao.maps.Size(44, 52), { offset: new kakao.maps.Point(22, 49) });
              m.marker.setImage(normal);
            }
          });
          const selected = window.markers.find(m => m.id === id);
          if (selected) {
            const hi = window.createHighlightMarkerImage(selected.pinImage, 48, 62);
            const highlight = new kakao.maps.MarkerImage(hi, new kakao.maps.Size(72, 68), { offset: new kakao.maps.Point(36, 65) });
            selected.marker.setImage(highlight);
            window.map.panTo(new kakao.maps.LatLng(lat, lng));
          }
        };

        // --- RN 메시지 핸들러 ---
        function handleReactNativeMessage(event) {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'location') {
              window.focusOnLocation(data.latitude, data.longitude, data.heading);
            } else if (data.type === 'shelters' && Array.isArray(data.list)) {
              window.addShelters(data.list);
            }
          } catch {}
        }
        window.addEventListener('message', handleReactNativeMessage);

        // --- 초기 마커 표시 ---
        window.focusOnLocation(initialLat, initialLng, 0);

      } catch (e) {
        console.error(e);
      }
    });
  </script>
</body>
</html>
